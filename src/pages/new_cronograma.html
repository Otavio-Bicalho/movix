<!DOCTYPE html>

                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </symbol>
                <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />

                    <line x1="4" y1="6" x2="20" y2="6" />
                    <line x1="7" y1="12" x2="17" y2="12" />
                    <line x1="10" y1="18" x2="14" y2="18" />
                </symbol>
                <symbol id="i-star-side" viewBox="0 0 24 24" fill="#111827">

                        d="M12 2l2.39 4.84 5.34.78-3.86 3.76.91 5.32L12 14.27l-4.78 2.51.91-5.32L4.27 7.62l5.34-.78z" />

        <div id="map"></div>

        <div class="side-overlay" id="side-overlay"></div>
        <aside class="side-menu" id="side-menu" aria-hidden="true">
            <div class="side-logo">
                <img src="../assets/img/logo/Movix.svg" alt="Movix">
            </div>

            <nav class="side-nav">
                <div class="side-group">
                    <a href="../../index.html" style="text-decoration: none;">
                        <button class="side-group-head" data-toggle>
                            <img class="side-icon" src="../assets/img/icons/map-symbol-icon.svg" alt="">
                            <span>Mapa</span>
                        </button>
                    </a>
                </div>
                <div class="side-group">
                    <button class="side-group-head" data-toggle>
                        <img class="side-icon" src="../assets/img/icons/carro.svg" alt="">
                        <span>Veículos</span>
                        <svg class="caret" width="14" height="14">
                            <use href="#i-chevron" />
                        </svg>
                    </button>
                    <ul class="side-sub">
                        <a href="../pages/MeusVeiculos.html" style="text-decoration: none;">
                            <li class="blockLogin">Meus Veículos</li>
                        </a>
                    </ul>
                </div>

                <div class="side-group">
                    <button class="side-group-head" data-toggle>
                        <svg class="side-icon-star" width="22" height="22">
                            <use href="#i-star-side" />
                        </svg>
                        <span>Avaliações</span>
                        <svg class="caret" width="14" height="14">
                            <use href="#i-chevron" />
                        </svg>
                    </button>
                    <ul class="side-sub">
                        <li class="blockLogin" data-href="">Inserir Avaliação</li>
                        <li class="blockLogin" data-href="">Minhas Avaliações</li>
                    </ul>
                </div>

                <div class="side-group">
                    <button class="side-group-head" data-toggle>
                        <img class="side-icon" src="../assets/img/icons/carro.svg" alt="">
                        <span>Administrativo</span>
                        <svg class="caret" width="14" height="14">
                            <use href="#i-chevron" />
                        </svg>
                    </button>
                    <ul class="side-sub">
                        <li class="blockLogin" data-href="src/pages/driver_flow.html">Motoristas</li>
                    </ul>
                </div>



                <!--<button class="side-item blockLogin">
                <svg width="18" height="18"><use href="#i-gear"/></svg>
                <span>Sugerir Alterações</span>
            </button> -->

            </nav>
        </aside>
        <header class="topbar" id="topbar">
            <button class="topbar-menu" id="topbar-menu" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>


        </header>
        <main>

            <div class="container">

                <h1 class="title">Adicionar Eventos</h1>

                <form class="form-evento">

                    <!-- LINHA 1 -->
                    <div class="form-row">

                        <div class="form-group">
                            <label>Tipo</label>

                            <select name="tipo_evento" id="tipo_evento">
                                <option selected value="">Selecione</option>
                                <option value="Documentação">Documentação</option>
                                <option value="Manutenção">Manutenção</option>

                            </select>
                        </div>

                        <div class="form-group">
                            <label>Evento</label>

                            <input type="text" placeholder="Pagamento do IPVA" required>
                        </div>

                    </div>


                    <div class="form-row">

                        <!--<div class="form-group">
                    <label>Veículo</label> 

                    <select name="veiculo" id="veiculo">
                        <option value="">Selecione</option>
                    </select>
                </div>
-->
                        <div class="form-group">
                            <label>Odômetro</label>

                            <input type="text" placeholder="Ex: 35.000 Km" required>
                        </div>

                    </div>


                    <div class="form-row form-row-3">

                        <div class="form-group">
                            <label>Data Início</label>

                            <input type="date" required>
                        </div>

                        <div class="form-group">
                            <label>Data Término</label>

                            <input type="date" required>
                        </div>

                        <div class="form-group">
                            <label>Valor</label>

                            <input type="text" placeholder="R$ 150,00" required>
                        </div>

                    </div>


                    <div class="form-buttons">

                        <a href="../pages/view_cronograma.html" class="btn-cancelar">Cancelar</a>

                        </button>

                        <button type="submit" class="btn-salvar">
                            Salvar
                        </button>

                    </div>

                </form>

            </div>

        </main>
        <script src="../assets/scripts/js/header_config.js"></script>
        <script src="../assets/scripts/js/config_cronograma.js"></script>
</body>

</html>

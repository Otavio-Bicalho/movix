<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movix — Login</title>
  <link rel="stylesheet" href="../assets/styles/business/pj_userflow.css" />
  <link rel="icon" type="image/x-icon" href="../assets/img/icons/carro.svg">
</head>

<body>
  <div class="phone">

    <div class="logo-block logo-block--login">
      <div class="logo-title">Movix</div>
    </div>

    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" autocomplete="email" />
    </div>

    <div class="field">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" autocomplete="current-password" />
    </div>

    <button class="btn-primary" onclick="LoginUser()">Login</button>

    <p class="link-row">
      Clique aqui para <a href="cadastroUser.html">cadastrar</a>
    </p>

    <div class="footer">
      <a href="business/cadastro_business.html">Cadastrar como empresa</a>
    </div>

  </div>
  <script src="../assets/scripts/js/loginUser.js"></script>

</body>

</html>

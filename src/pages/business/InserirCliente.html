            <script>
                const menuBtn = document.getElementById("biz-menu-btn");
                const sidebar = document.querySelector(".biz-sidebar");
                if (menuBtn) {
                    menuBtn.addEventListener("click", () => sidebar.classList.toggle("aberto"));
                }
                document.addEventListener("click", (e) => {
                    if (sidebar && sidebar.classList.contains("aberto")) {
                        if (!sidebar.contains(e.target) && e.target !== menuBtn) {
                            sidebar.classList.remove("aberto");
                        }
                    }
                });

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movix for Business — Login</title>
  <link rel="stylesheet" href="../../assets/styles/business/pj_userflow.css" />
  <link rel="icon" href="../../assets/img/logo/movix_forbusiness.svg" type="image/x-icon">
</head>

<body data-page="login" onload="carregarJSONs()">
  <div class="phone">

    <div class="logo-block logo-block--login">
      <div class="logo-title">Movix</div>
      <div class="logo-sub">for business</div>
    </div>

    <div id="erroMsg" class="erro-msg"></div>

    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" autocomplete="email" />
    </div>

    <div class="field">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" autocomplete="current-password" />
    </div>

    <button type="button" id="btnLogin" class="btn-primary" onclick="LoginBusiness()">Login</button>

    <p class="link-row">
      Clique aqui para <a href="../business/cadastro_business.html">cadastrar</a>
    </p>

    <div class="footer">
      <a href="../../pages/cadastroUser.html">Cadastrar como usuário</a>
    </div>

  </div>
  <script src="../../assets/scripts/js/business/cad_empresa.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movix — Cadastro</title>
  <link rel="stylesheet" href="../assets/styles/business/pj_userflow.css" />
  <link rel="icon" href="../../assets/img/logo/movix_forbusiness.svg" type="image/x-icon">
</head>

<body>
  <div class="phone">

    <div class="logo-block logo-block--cadastro">
      <div class="logo-title">Movix</div>
    </div>

    <div class="field">
      <label for="cadNome">Nome</label>
      <input type="text" id="cadNome" autocomplete="name" />
    </div>

    <div class="field">
      <label for="cadEmail">E-mail</label>
      <input type="email" id="cadEmail" autocomplete="email" />
    </div>

    <div class="field">
      <label for="cadTelefone">Telefone pessoal</label>
      <input type="tel" id="cadTelefone" autocomplete="tel" />
    </div>

    <div class="field">
      <label for="cadCpf">CPF</label>
      <input type="text" id="cadCpf" />
    </div>

    <div class="field">
      <label for="cadSenha">Senha</label>
      <input type="password" id="cadSenha" autocomplete="new-password" />
    </div>

    <div class="field">
      <label for="cadConfirmar">Confirmar Senha</label>
      <input type="password" id="cadConfirmar" autocomplete="new-password" />
    </div>

    <button class="btn-primary">Avançar</button>

    <p class="link-row">
      Clique aqui para <a href="loginUser.html">logar</a>
    </p>

    <div class="footer">
      <a href="business/cadastro_business.html">Cadastrar como empresa</a>
    </div>

  </div>
</body>

</html>
